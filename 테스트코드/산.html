<!doctype html>
<html>
  <head>
    <title>산리오 코리아 홍홍</title>
    <meta charset="UTF-8" />
    <!-- 인터널스타일시트(internal style sheet) -->
    <!-- 상단영역 스타일 (Top Area Styles) -->
    <style>
      /* 웹폰트 로딩하기(CDN방식)
        CDN은 Content Delivery Networt 즉, 네트워크 망으로
        컨텐트를 배달시켜 쓰는 방식 */

      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nanum+Gothic&display=swap");

      @import url("https://cdn.jsdelivr.net/gh/moonspam/NanumBarunGothic@1.0/nanumbarungothicsubset.css");

      /* 전체 루트 설정 */
      html {
        /* rem단위를 위한 Root 글자크기설정 */
        font-size: 10px;
        /* 왜 10px인가? rem단위에 계산이 용이함! */
      }
      html,
      body {
        /* 웹폰트체 지정 (콤마는 우선순위) */
        font-family: Montserrat, NanumBarunGothic, Dotum, sans-serif;
      }
      /* 공통요소 초기화 */
      html,
      body,
      div,
      span,
      applet,
      object,
      iframe,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      blockquote,
      pre,
      a,
      abbr,
      acronym,
      address,
      big,
      cite,
      code,
      del,
      dfn,
      em,
      img,
      ins,
      kbd,
      q,
      s,
      samp,
      small,
      strike,
      strong,
      sub,
      sup,
      tt,
      var,
      b,
      u,
      i,
      center,
      dl,
      dt,
      dd,
      ol,
      ul,
      li,
      fieldset,
      form,
      label,
      legend,
      table,
      caption,
      tbody,
      tfoot,
      thead,
      tr,
      th,
      td,
      article,
      aside,
      canvas,
      details,
      embed,
      figure,
      figcaption,
      footer,
      header,
      hgroup,
      menu,
      nav,
      output,
      ruby,
      section,
      summary,
      time,
      mark,
      audio,
      video {
        margin: 0;
        padding: 0;
      }

      .top-inner {
        max-width: 1440px; /* 최대 너비 지정 */
        margin: 0 auto; /* 가운데 정렬 */
        display: flex; /* 가로 레이아웃을 위한 flex 사용 */
        align-items: center; /* 세로 중앙 정렬 */
        justify-content: space-between; /* 양끝 정렬 */
        height: 90px; /* 높이 지정 */
      }
      .logo-box {
        flex: 0 0 auto; /* 크기가 고정된 flex 아이템 */
      }
      .logo-box img {
        height: 56px; /* 로고 이미지 높이 고정 */
      }
      .menu-list {
        flex: 0 0 auto; /* 크기 고정 */
        display: flex; /* 가로로 나열 */
        gap: 48px; /* 메뉴 아이템 간 간격 */
        list-style: none; /* 기본 리스트 마커 제거 */
        padding: 0; /* 패딩 제거 */
        margin: 0; /* 마진 제거 */
        font-size: 1.6rem; /* 폰트 크기 */
      }
      .menu-list li a {
        color: inherit; /* 글자색 상속 */
        text-decoration: none; /* 밑줄 제거 */
        text-transform: uppercase; /* 대문자 변환 */
      }
      /* 배너영역 스타일 */
      .banner-area {
        position: relative;
        padding: 80px;
        padding-bottom: 160px;
        background: url("./images/main_visual_bg.jpg") repeat 0 0/50px;
        /* 배경스타일 사용법:
        background: 색 이 반 고 윙/크
        background: 배경색 이미지 반복 고정 위치/크기 */
      }
      .banner-area .center-banner {
        text-align: center;
        /* display: flex; */
        /* justify-content: center; */
        /* align-items: center; */
      }
      /* 메인 비주얼 이미지 스타일 */
      .banner-area .main-visual-img {
        /* display: block; */
        width: 984px;
        max-width: 100%;
      }

      /* SNS 버튼 박스 스타일 */
      .sns {
        /* flex박스 세로정렬 */
        display: flex;
        flex-direction: column;
        /* 배너영역 상대위치 기준, 절대위치 배치 */
        position: absolute;
        top: 50px;
        right: 50px;
      }
      .sns img {
        width: 40px;
        height: 40px;
      }

      /* 스크롤 유도 애니 버튼박스 */
      .scroll_btn {
        position: absolute;
        bottom: 50px;
        left: 50%;
        translate: -50%;
        width: 79px;
        height: 70px;
        /* outline: 2px solid blue; */
      }
      /* 마우스 글자박스 */
      .scroll_btn p {
        position: absolute;
        bottom: 0;
        width: 100%;
        text-align: center;
        text-transform: uppercase;
        font-size: 1rem;
        /* outline: 1px solid red; */
      }
      /* 움직일 대상 마우스 */
      .scroll_btn .mouse {
        position: absolute;
        left: 50%;
        translate: -50%;
        top: 0px;
        display: block;
        width: 26px;
        height: 36px;
        background-color: #fff;
        border: 1px solid #222;
        border-radius: 15px;
        /* 애니메이션 호출 : (이시이지반방마)
        이름 시간 이징 지연시간 반복 방향 마지막상태 */
        animation: mouse-ani 0.5s ease-in-out infinite alternate;
      }
      /* 마우스 애니메이션 키프레임 */
      @keyframes mouse-ani {
        /* 시작값 from이 처음셋팅값과 같으면 생략가능 */
        from {
          top: 0;
        }
        to {
          top: 15px;
        }
      }

      .scroll_btn .mouse span {
        position: absolute;
        top: 27%;
        left: 50%;
        translate: -50% -50%;
        width: 5px;
        height: 5px;
        background-color: #222;
        border-radius: 50%;
        opacity: 0;
        /* 마우스휠 키프레임 호출 : 이시이지반방마 */
        animation: mouse-dot-ani 1.5s linear infinite;
      }
      /* 마우스휠 애니메이션 키프레임 */
      @keyframes mouse-dot-ani {
        0% {
          opacity: 0;
          top: 27%;
        }
        10% {
          opacity: 1;
          top: 27%;
        }
        40% {
          opacity: 1;
          top: 50%;
        }
        60% {
          opacity: 0;
          top: 50%;
        }
        100% {
          opacity: 0;
          top: 50%;
        }
      }

      /* 캐리턱영역 박스 */
      .character-area {
        height: 100vh;
      }
      /* 공통타이틀박스 */
      .tit-box {
        max-width: 1200px;
        margin: 0 auto;
        outline: 3px dashed blue;
      }
      /* 타이틀파트 */
      .tit-box .part-tit {
        text-align: center;
        padding: 40px 0;
        font-size: 5rem;
        font-weight: normal;
      }

      /* 타이틀박스 하위 버튼박스 */
      .btn-box {
        text-align: center;
        padding: 20px 0;
      }

      .btn-view {
        text-decoration: none;
        color: #222;
        font-size: 2rem;
        display: inline-block;
        margin: 0 auto;
        border-radius: 24px;
        border: 1px solid #222;
        padding: 10px 23px;
      }
    </style>
  </head>
  <body>
    <main class="wrapper">
      <!-- 1. 상단영역 -->
      <header class="top-area">
        <!-- 상단영역 내용 -->
        <div class="top-inner">
          <!-- 로고이미지박스 (왼쪽 끝) -->
          <div class="logo-box">
            <img src="./images/logo_2023.png" alt="산리오코리아 로고" />
          </div>
          <!-- 메뉴리스트 (오른쪽 끝) -->
          <nav>
            <ul class="menu-list">
              <li><a href="#company">company</a></li>
              <li><a href="#character">character</a></li>
              <li><a href="#place">place</a></li>
              <li><a href="#recruit">recruit</a></li>
            </ul>
          </nav>
        </div>
      </header>
      <!-- 2. 메인영역 -->
      <section class="main-area">
        <!-- 2-1. 배너영역 -->
        <section class="banner-area">
          <!-- 배너영역 내용 -->
          <div class="center-banner">
            <img
              src="./images/main_visual_pc_v1.png"
              alt="메인 비주얼"
              class="main-visual-img"
            />
          </div>

          <!-- SNS이동버튼박스 -->
          <div class="sns">
            <a href="https://www.instagram.com/sanrio_kr/" target="_blank"
              ><img src="./images/i_ins_pc_v3.png" alt="instargram"
            /></a>
            <a
              href="https://www.youtube.com/c/sanriokorea/featured"
              target="_blank"
              ><img src="./images/i_you_pc_v3.png" alt="youtube"
            /></a>
          </div>
          <!-- 스크롤 유도 애니박스 -->
          <div class="scroll_btn">
            <span class="mouse"><span></span></span>
            <p>scroll down</p>
          </div>
        </section>
        <!-- 2-2. 캐릭터영역 -->
        <section class="character-area">
          <!-- 캐릭터영역 내용 -->
          <div class="tit-box">
            <h2 class="part-tit">character</h2>
            <div class="btn-box">
              <a href="#" class="btn-view">veiw more</a>
            </div>
          </div>
        </section>
        <!-- 2-3. 컴퍼니영역 -->
        <section class="company-area">
          <!-- 컴퍼니영역 내용 -->
        </section>
        <!-- 2-4. 리쿠르트영역 -->
        <section class="recruit-area">
          <!-- 리쿠르트영역 내용 -->
        </section>
        <!-- 2-5. 플레이스영역 -->
        <section class="place-area">
          <!-- 플레이스영역 내용 -->
        </section>
        <!-- 2-6. 컨텍어스영역 -->
        <section class="contactus-area">
          <!-- 컨텍어스영역 내용 -->
        </section>
      </section>
      <!-- 3. 하단영역 -->
      <footer class="bottom-area">
        <!-- 하단영역 내용 -->
      </footer>
    </main>
  </body>
</html>
