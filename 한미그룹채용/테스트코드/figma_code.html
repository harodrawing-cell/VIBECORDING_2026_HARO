<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한미그룹 2026년 하반기 공개채용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --white: #FFFFFF;
    --red: #E60012;
    --orange: #FF5D32;
    --white-10: rgba(255, 255, 255, 0.1);
    --white-50: rgba(255, 255, 255, 0.5);
    --gradient-cta: linear-gradient(90deg, #E60012 0%, #FF5D32 100%);
    --font: 'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --transition: 0.2s ease;
    --page-width: 1920px;
    --container-width: 1440px;
    --hero-height: 900px;
    --scale: 1; /* JS가 1440px 미만에서 갱신 */
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--black);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    position: relative;
  }
  a { color: inherit; text-decoration: none; transition: color var(--transition); }
  button { font-family: inherit; border: 0; cursor: pointer; }
  img { display: block; max-width: none; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

  /* ---------- Hero (main_visual) ---------- */
  .main-visual {
    position: relative;
    width: 100%;
    max-width: var(--page-width);
    height: calc(var(--hero-height) * var(--scale));
    min-height: calc(720px * var(--scale));
    margin: 0 auto;
    overflow: hidden;
    background: #FFF1EC url("./images/mv_bg_png.png") center / cover no-repeat;
  }

  /* 1440 기준 내용 컨테이너 */
  .mv-container {
    position: relative;
    width: var(--container-width);
    height: var(--hero-height);
    margin: 0 auto;
    transform: scale(var(--scale));
    transform-origin: top center;
  }

  /* ---------- Header ---------- */
  /* header는 main 밖(형제)에 위치하며, 히어로 상단에 겹쳐 보이도록 절대 배치 */
  .site-header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: calc(100px * var(--scale));
    z-index: 5;
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: var(--container-width);
    height: 100px;
    margin: 0 auto;
    padding: 0 60px;
    transform: scale(var(--scale));
    transform-origin: top center;
  }
  .brand { display: block; width: 182px; height: 31px; }
  .brand img { width: 182px; height: 31px; }

  .gnb { display: flex; align-items: center; }
  .gnb-list {
    display: flex;
    gap: 40px;
    margin: 0; padding: 0;
    list-style: none;
  }
  .gnb-list a {
    display: flex;
    align-items: center;
    height: 100px;
    font-weight: 600;
    font-size: 19.1px;
    line-height: 20px;
    letter-spacing: -0.4px;
    white-space: nowrap;
  }
  .gnb-list li:first-child a { font-size: 19.4px; }
  .gnb-list a:hover { color: var(--red); }

  .gnb-cta { padding-left: 40px; }

  /* 버튼 공통: hover 시 흰색/빨간색 반전 */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 500px;
    color: var(--white);
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    transition: background-color var(--transition), color var(--transition), box-shadow var(--transition);
  }
  .btn-apply {
    gap: 10px;
    width: 119px;
    height: 48px;
    padding: 13.5px 20px 14.5px;
    background: var(--red);
    font-size: 17.4px;
    line-height: 18px;
    letter-spacing: -0.36px;
  }
  .btn-apply svg { width: 7px; height: 12px; flex: none; }
  .btn-apply:hover {
    background: var(--white);
    color: var(--red);
    box-shadow: inset 0 0 0 1px var(--red);
  }

  .btn-main {
    width: 303px;
    height: 72px;
    padding: 18.7px 64px 19.3px;
    background-image: var(--gradient-cta);
    background-color: var(--red);
    font-size: 22.7px;
    line-height: 34px;
    letter-spacing: -0.48px;
  }
  .btn-main:hover {
    background-image: none;
    background-color: var(--white);
    color: var(--red);
    box-shadow: inset 0 0 0 2px var(--red);
  }

  /* ---------- Copy ---------- */
  .mv-copy {
    position: absolute;
    left: 100px;
    top: 0; bottom: 0;
    width: 560px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 80px;
    z-index: 3;
  }
  .mv-text { display: flex; flex-direction: column; gap: 31.9px; }
  .mv-title { margin: 0; display: flex; flex-direction: column; gap: 31.9px; font-weight: inherit; }
  .mv-season {
    font-weight: 700;
    font-size: 31.1px;
    line-height: 45px;
    letter-spacing: -0.64px;
  }
  .mv-title-wrap { display: flex; flex-direction: column; }
  .mv-brand {
    font-weight: 800;
    font-size: 72.3px;
    line-height: 76px;
    letter-spacing: -1.76px;
  }
  .mv-kind {
    font-weight: 800;
    font-size: 45.8px;
    line-height: 72px;
    letter-spacing: -1.12px;
  }
  .mv-period {
    margin: 0;
    font-weight: 500;
    font-size: 19.2px;
    line-height: 28px;
    letter-spacing: -0.4px;
    white-space: nowrap;
  }

  /* ---------- Visual collage ---------- */
  .mv-visual {
    position: absolute;
    top: 0; left: 0;
    width: 1440px; height: 900px;
    z-index: 1;
    pointer-events: none;
  }
  .ring {
    position: absolute;
    border-radius: 500px;
  }
  .ring-glow {
    left: 700px; top: 118px;
    width: 663px; height: 663px;
    border: 5px solid var(--white);
    background: radial-gradient(70.71% 70.71% at 50% 50%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
    filter: blur(5px);
  }
  .ring-line {
    left: 755px; top: 173px;
    width: 553px; height: 553px;
    border: 1px solid var(--white-50);
  }
  .mv-visual img { position: absolute; }
  .micro { left: 765.8px;  top: 151.7px; width: 289.52px; height: 221.76px; }
  .char1 { left: 815.1px;  top: 295.1px; width: 253.44px; height: 395.12px; }
  .char2 { left: 1036.8px; top: 293.4px; width: 181.28px; height: 381.04px; }
  .char3 { left: 739.4px;  top: 469.4px; width: 216.48px; height: 262.24px; }
  .char4 { left: 1095.8px; top: 490.5px; width: 292.16px; height: 206.8px; }

  /* 별 장식 (mv_star*.png 미제공 → CSS 4각 별로 대체) */
  .star {
    position: absolute;
    background: var(--star, #FFC928);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  }
  .star1 { --star: #CFE6F5; left: 921.6px;  top: 237px;   width: 17.6px;  height: 16.72px; }
  .star2 { --star: #A267F0; left: 740.3px;  top: 469.4px; width: 22.88px; height: 23.76px; }
  .star3 { --star: #FFC928; left: 1314.9px; top: 474.6px; width: 21.12px; height: 21.12px; }
  .star3.big { left: 1332.5px; top: 432.4px; width: 34.32px; height: 35.2px; }
  .star4 { --star: #FF5D32; left: 1160.9px; top: 249.4px; width: 23.76px; height: 24.64px; }

  /* ---------- Scroll button ---------- */
  .scroll-down {
    position: absolute;
    left: 50%;
    bottom: 64px;
    width: 80px; height: 80px;
    margin-left: -40px;
    isolation: isolate;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 500px;
    background: var(--white-10);
    box-shadow: inset 4px 4px 10px rgba(255,255,255,0.4), inset -4px -4px 10px rgba(0,0,0,0.1);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    color: var(--white);
    z-index: 2;
    transition: background-color var(--transition), color var(--transition);
  }
  .scroll-down::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(132.3deg, rgba(255,255,255,0.8) 12.7%, rgba(255,255,255,0) 86.3%);
    z-index: -1;
    opacity: 0.5;
  }
  .scroll-down svg { width: 40px; height: 40px; }
  .scroll-down:hover { background: var(--white); color: var(--red); }

  /* ---------- Footer ---------- */
  .site-footer {
    background: var(--black);
    color: var(--white-50);
  }
  .footer-inner {
    width: 100%;
    max-width: var(--container-width);
    margin: 0 auto;
    padding: 40px 60px;
    font-weight: 500;
    font-size: 14px;
    line-height: 22px;
    letter-spacing: -0.3px;
  }
  .footer-inner p { margin: 0; }

  /* =====================================================
     Responsive (Desktop First / max-width)
     ===================================================== */
  /* 모바일 전용 요소는 기본(데스크탑)에서 숨김 */
  .header-apply, .btn-menu, .gnb-head { display: none; }

  /* ---------- Tablet : 1024px 이하 ---------- */
  @media (max-width: 1024px) {
    /* 헤더 */
    .header-inner { width: 100%; padding: 0 clamp(20px, 3.9vw, 40px); transform: none; }
    .brand { width: clamp(110px, 14.8vw, 152px); height: auto; }
    .brand img { width: 100%; height: auto; }
    .gnb-list { gap: clamp(10px, 2.93vw, 30px); }
    .gnb-list a,
    .gnb-list li:first-child a { font-size: clamp(12px, 1.66vw, 17px); }
    .gnb-cta { padding-left: clamp(12px, 2.93vw, 30px); }
    .btn-apply {
      width: clamp(88px, 11.7vw, 120px);
      height: clamp(36px, 4.3vw, 44px);
      padding: 0;
      font-size: clamp(13px, 1.56vw, 16px);
    }
    .btn-apply svg { width: 6px; height: 10px; }

    /* 히어로: 텍스트 위 / 비주얼 아래 세로 배치 */
    .main-visual { height: auto; min-height: 0; }
    .mv-container { width: 100%; height: auto; padding-bottom: 140px; transform: none; }

    .mv-copy {
      position: static;
      width: auto;
      padding: 98px clamp(20px, 3.9vw, 40px) 0;
      justify-content: flex-start;
      gap: 40px;
    }
    .mv-text { gap: 22px; }
    .mv-title { gap: 16px; }
    .mv-season { font-size: clamp(20px, 2.73vw, 28px); }
    .mv-brand { font-size: clamp(44px, 5.57vw, 57px); line-height: 60px; letter-spacing: -1.4px; }
    .mv-kind { font-size: clamp(28px, 3.32vw, 34px); line-height: 54px; letter-spacing: -0.9px; }
    .mv-period { font-size: clamp(13px, 1.875vw, 19.2px); white-space: normal; }
    .btn-main { width: 303px; height: 64px; padding: 0; font-size: 20px; line-height: 30px; letter-spacing: -0.42px; }

    /* 비주얼 콜라주: 1440 기준 px 좌표(700,118 ~ 1390,781) → 박스 대비 % 로 변환 */
    .mv-visual {
      position: relative;
      width: clamp(300px, 46vw, 470px);
      height: auto;
      aspect-ratio: 690 / 663;
      margin: 30px auto 0;
    }
    .ring-glow { left: 0; top: 0; width: 96.09%; height: 100%; }
    .ring-line { left: 7.97%; top: 8.3%; width: 80.14%; height: 83.41%; }
    .micro { left: 9.54%; top: 5.08%; width: 41.96%; height: 33.45%; }
    .char1 { left: 16.68%; top: 26.71%; width: 36.73%; height: 59.6%; }
    .char2 { left: 48.81%; top: 26.46%; width: 26.27%; height: 57.47%; }
    .char3 { left: 5.71%; top: 53%; width: 31.37%; height: 39.55%; }
    .char4 { left: 57.36%; top: 56.18%; width: 42.34%; height: 31.19%; }
    .star1 { left: 32.12%; top: 17.95%; width: 2.55%; height: 2.52%; }
    .star2 { left: 5.84%; top: 53%; width: 3.32%; height: 3.58%; }
    .star3 { left: 89.12%; top: 53.78%; width: 3.06%; height: 3.19%; }
    .star3.big { left: 91.67%; top: 47.42%; width: 4.97%; height: 5.31%; }
    .star4 { left: 66.8%; top: 19.82%; width: 3.44%; height: 3.72%; }

    .scroll-down { bottom: 40px; width: 64px; height: 64px; margin-left: -32px; }
    .scroll-down svg { width: 32px; height: 32px; }
  }

  /* ---------- Mobile : 390px 이하 ---------- */
  @media (max-width: 390px) {
    /* 헤더: 로고 + 지원하기 + 햄버거 */
    .site-header { height: 70px; }
    .header-inner { height: 70px; padding: 0 20px; }
    .brand { width: 130px; margin-right: auto; }

    .header-apply {
      display: inline-flex;
      position: relative;
      width: 63px;
      height: 29px;
      font-size: 12px;
      line-height: 1;
      letter-spacing: -0.3px;
    }
    .header-apply::after { content: ""; position: absolute; inset: -8px -4px; } /* 터치 영역 확장 */

    .btn-menu {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin-right: -12px; /* 아이콘 우측을 20px 여백에 맞춤 */
      padding: 0;
      background: transparent;
      color: var(--black);
    }
    .btn-menu svg { width: 20px; height: 14px; }

    /* 전체 메뉴: 오른쪽에서 슬라이드 */
    .gnb {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 100%;
      flex-direction: column;
      align-items: stretch;
      padding: 0 20px;
      overflow-y: auto;
      background: var(--white) url("./images/mo_menu_char.png") no-repeat right 12px bottom 24px / 121px auto;
      z-index: 10;
      transform: translateX(100%);
      visibility: hidden;
      transition: transform 0.3s ease, visibility 0s linear 0.3s;
    }
    .gnb.is-open {
      transform: translateX(0);
      visibility: visible;
      transition: transform 0.3s ease, visibility 0s;
    }
    html.menu-open,
    html.menu-open body { overflow: hidden; } /* 배경 스크롤 방지 */

    .gnb-head { display: flex; align-items: center; justify-content: space-between; height: 48px; }
    .gnb-head img { width: 94px; height: 16px; }
    .btn-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin-right: -15px;
      padding: 0;
      background: transparent;
      color: var(--black);
    }
    .btn-close svg { width: 14px; height: 14px; }

    .gnb-list { flex-direction: column; gap: 0; margin-top: 44px; }
    .gnb-list li { border-bottom: 1px solid #E5E5E5; }
    .gnb-list a,
    .gnb-list li:first-child a { height: 51px; font-size: 17px; }
    .gnb-cta { padding: 36px 0 0; }
    .gnb-cta .btn-apply { width: 100%; height: 44px; font-size: 16px; }

    /* 히어로 */
    .mv-container { padding-bottom: 90px; }
    .mv-copy { padding: 100px 20px 0; gap: 48px; }
    .mv-text { gap: 24px; }
    .mv-title { gap: 20px; }
    .mv-season { font-size: 20px; line-height: 34px; letter-spacing: -0.4px; }
    .mv-brand { font-size: 54px; line-height: 58px; letter-spacing: -1.3px; }
    .mv-kind { font-size: 34px; line-height: 52px; letter-spacing: -0.8px; }
    .mv-period { font-size: 12.5px; line-height: 20px; letter-spacing: -0.26px; }
    .btn-main { width: 200px; height: 47px; font-size: 15px; line-height: 22px; letter-spacing: -0.3px; }

    .mv-visual { width: calc(100% - 30px); margin-top: 32px; }
    .ring-glow { border-width: 3px; }
    .scroll-down { bottom: 20px; width: 40px; height: 40px; margin-left: -20px; }
    .scroll-down svg { width: 20px; height: 20px; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>

<!-- 상단 메뉴 영역 -->
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#main-visual" aria-label="한미그룹 홈">
      <img src="./images/logo_svg.svg" alt="한미그룹 Hanmi">
    </a>

    <nav class="gnb" id="gnb" aria-label="주요 메뉴">
      <div class="gnb-head">
        <img src="./images/logo_svg.svg" alt="한미그룹 Hanmi">
        <button type="button" class="btn-close" aria-label="메뉴 닫기">
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <ul class="gnb-list">
        <li><a href="#jobs">직무소개</a></li>
        <li><a href="#qualification">지원자격 및 접수방법</a></li>
        <li><a href="#schedule">채용설명회 일정</a></li>
      </ul>
      <div class="gnb-cta">
        <a class="btn btn-apply" href="#apply">
          <span>지원하기</span>
          <svg viewBox="0 0 7 12" fill="none" aria-hidden="true">
            <path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </nav>

    <!-- 모바일 전용: 헤더 지원하기 + 햄버거 -->
    <a class="btn btn-apply header-apply" href="#apply">지원하기</a>
    <button type="button" class="btn-menu" aria-label="메뉴 열기" aria-controls="gnb" aria-expanded="false">
      <svg viewBox="0 0 20 14" fill="none" aria-hidden="true">
        <path d="M0 1h20M0 7h20M0 13h20" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
  </div>
</header>

<!-- 메인 컨텐츠 영역 -->
<main>
  <section class="main-visual" id="main-visual" aria-label="한미그룹 2026년 하반기 공개채용">
    <div class="mv-container">

      <div class="mv-visual" aria-hidden="true">
        <div class="ring ring-glow"></div>
        <div class="ring ring-line"></div>
        <img class="micro" src="./images/mv_micro_png.png" alt="">
        <img class="char1" src="./images/mv_char1_png.png" alt="">
        <img class="char2" src="./images/mv_char2_png.png" alt="">
        <img class="char3" src="./images/mv_char3_png.png" alt="">
        <img class="char4" src="./images/mv_char4_png.png" alt="">
        <span class="star star1"></span>
        <span class="star star2"></span>
        <span class="star star3"></span>
        <span class="star star3 big"></span>
        <span class="star star4"></span>
      </div>

      <div class="mv-copy">
        <div class="mv-text">
          <h1 class="mv-title">
            <span class="mv-season">2026년 하반기</span>
            <span class="mv-title-wrap">
              <span class="mv-brand">한미그룹</span>
              <span class="mv-kind">공개채용</span>
            </span>
          </h1>
          <p class="mv-period">모집기간 : 2026.9.28(월) ~ 2026.10.18(일) 23:59까지</p>
        </div>
        <div>
          <a class="btn btn-main" href="#jobs">모집직무 바로가기!</a>
        </div>
      </div>

      <a class="scroll-down" href="#jobs" aria-label="아래로 스크롤">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <path d="M10 15l10 10 10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

    </div>
  </section>
</main>

<!-- 하단 푸터 영역 -->
<footer class="site-footer">
  <div class="footer-inner">
    <p>&copy; 2026 Hanmi Group. All rights reserved.</p>
  </div>
</footer>

<script>
  // 1440px 미만 뷰포트에서는 컨테이너 전체를 비율 축소해 레이아웃이 깨지지 않게 한다.
  (function () {
    var root = document.documentElement;
    function fit() {
      // 태블릿/모바일(1024px 이하)은 CSS 반응형 레이아웃을 쓰므로 축소하지 않는다.
      var w = window.innerWidth;
      var s = w <= 1024 ? 1 : Math.min(1, w / 1440);
      root.style.setProperty('--scale', s.toFixed(4));
    }
    fit();
    window.addEventListener('resize', fit);

    // 모바일 햄버거 메뉴
    var toggle = document.querySelector('.btn-menu');
    var closeBtn = document.querySelector('.btn-close');
    var gnb = document.getElementById('gnb');
    function setMenu(open) {
      gnb.classList.toggle('is-open', open);
      root.classList.toggle('menu-open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) closeBtn.focus();
      else if (gnb.contains(document.activeElement)) toggle.focus();
    }
    toggle.addEventListener('click', function () { setMenu(true); });
    closeBtn.addEventListener('click', function () { setMenu(false); });
    gnb.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () { setMenu(false); }); // 스크롤 잠금 해제 후 아래 앵커 이동 실행
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && gnb.classList.contains('is-open')) setMenu(false);
    });
    var mq = window.matchMedia('(max-width: 390px)');
    function onMq(e) { if (!e.matches) setMenu(false); }
    if (mq.addEventListener) mq.addEventListener('change', onMq); else mq.addListener(onMq);

    // 앵커 이동: 대상 섹션이 있을 때만 부드럽게 스크롤
    document.querySelectorAll('a[href^="#"]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var id = a.getAttribute('href');
        var target = id.length > 1 ? document.querySelector(id) : null;
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });
  })();
</script>
</body>
</html>
