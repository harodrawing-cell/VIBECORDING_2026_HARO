<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한미그룹 2026년 하반기 공개채용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E60012;
    --orange: #FF5D32;
    --black: #000000;
    --white: #FFFFFF;
    --gradient-cta: linear-gradient(90deg, #E60012 0%, #FF5D32 100%);
    --font: 'Inter', 'Noto Sans KR', 'Pretendard', sans-serif;
    --ease: 0.2s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    color: var(--black);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; transition: color var(--ease), background-color var(--ease), border-color var(--ease), opacity var(--ease); }
  ul { list-style: none; }
  img { display: block; max-width: 100%; }
  button { font-family: inherit; border: 0; cursor: pointer; }

  /* ---------- Header ---------- */
  .site-header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100px;
    z-index: 10;
  }
  .header-inner {
    max-width: 1440px;
    height: 100%;
    margin: 0 auto;
    padding: 0 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; width: 182px; height: 31px; flex: none; }
  .brand img { width: 182px; height: 31px; }

  .gnb { display: flex; align-items: center; height: 100%; }
  .gnb-list { display: flex; gap: 40px; height: 100%; align-items: center; }
  .gnb-list a {
    display: flex;
    align-items: center;
    height: 100%;
    font-size: 19px;
    line-height: 20px;
    font-weight: 600;
    letter-spacing: -0.4px;
    color: var(--black);
  }
  .gnb-list a:hover, .gnb-list a:focus-visible { color: var(--red); }
  .gnb-cta { padding-left: 40px; }

  /* ---------- Buttons ---------- */
  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 2px solid transparent;
    border-radius: 500px;
    color: var(--white);
    font-weight: 600;
    letter-spacing: -0.4px;
    overflow: hidden;
    isolation: isolate;
    transition: color var(--ease), border-color var(--ease), background-color var(--ease);
  }
  .btn svg { transition: stroke var(--ease); }
  .btn-sm { width: 119px; height: 48px; padding: 0 20px; font-size: 17.4px; line-height: 18px; background: var(--red); }
  .btn-lg { width: 303px; height: 72px; padding: 0 64px; font-size: 22.7px; line-height: 34px; background: var(--gradient-cta); }
  /* 흰색 오버레이로 hover 반전 구현 (그라데이션은 transition 불가) */
  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--white);
    opacity: 0;
    z-index: -1;
    transition: opacity var(--ease);
  }
  .btn:hover, .btn:focus-visible { color: var(--red); border-color: var(--red); }
  .btn:hover::before, .btn:focus-visible::before { opacity: 1; }
  .btn svg path { stroke: currentColor; }

  /* ---------- Main Visual ---------- */
  .main-visual {
    position: relative;
    width: 100%;
    height: 900px;
    min-height: 720px;
    max-height: 100vh;
    background: #fff3ee url("./images/mv_bg.png") center / cover no-repeat;
    overflow: hidden;
  }
  @media (max-height: 720px) { .main-visual { max-height: none; } }

  .mv-inner {
    position: relative;
    max-width: 1440px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
  }

  .mv-text {
    flex: none;
    width: 560px;
    margin-left: 100px;
    display: flex;
    flex-direction: column;
    gap: 80px;
    position: relative;
    z-index: 2;
  }
  .mv-copy { display: flex; flex-direction: column; gap: 31.9px; width: 442px; }
  .mv-sub {
    font-size: 31.1px; line-height: 45px; font-weight: 700; letter-spacing: -0.64px;
  }
  .mv-title { display: flex; flex-direction: column; }
  .mv-title strong {
    font-size: 72.3px; line-height: 76px; font-weight: 800; letter-spacing: -1.76px;
  }
  .mv-title span {
    font-size: 45.8px; line-height: 72px; font-weight: 800; letter-spacing: -1.12px;
  }
  .mv-period {
    font-size: 19.2px; line-height: 28px; font-weight: 500; letter-spacing: -0.4px;
  }

  /* 캐릭터 스테이지 (겹침 구성을 위해 스테이지 내부만 absolute) */
  .mv-stage {
    position: relative;
    flex: none;
    width: 764px;
    height: 663px;
    margin-left: 40px;
    z-index: 1;
  }
  .mv-stage .ring-glow {
    position: absolute;
    left: 0; top: 0;
    width: 663px; height: 663px;
    border: 5px solid var(--white);
    border-radius: 500px;
    background: radial-gradient(70.71% 70.71% at 50% 50%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
    filter: blur(5px);
  }
  .mv-stage .ring-line {
    position: absolute;
    left: 55px; top: 55px;
    width: 553px; height: 553px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 500px;
  }
  .mv-stage img { position: absolute; height: auto; }
  .mv-micro { left: 162.4px; top: 6.08px; width: 289.52px; }
  .mv-char1 { left: 211.68px; top: 149.52px; width: 253.44px; }
  .mv-char2 { left: 433.44px; top: 147.76px; width: 181.28px; }
  .mv-char3 { left: 136px;    top: 323.76px; width: 216.48px; }
  .mv-char4 { left: 492.4px;  top: 344.88px; width: 292.16px; }
  .mv-star1 { left: 318.16px; top: 91.44px;  width: 17.6px; }
  .mv-star2 { left: 136.88px; top: 323.76px; width: 22.88px; }
  .mv-star3 { left: 711.52px; top: 329.04px; width: 21.12px; }
  .mv-star4 { left: 557.52px; top: 103.76px; width: 23.76px; }
  .mv-star5 { left: 729.12px; top: 286.8px;  width: 34.32px; }

  /* 스크롤 버튼 */
  .scroll-wrap {
    position: absolute;
    left: 0; right: 0; bottom: 64px;
    display: flex;
    justify-content: center;
    z-index: 2;
  }
  .btn-scroll {
    width: 80px; height: 80px;
    border-radius: 500px;
    background: rgba(255,255,255,0.1);
    box-shadow: inset 4px 4px 10px rgba(255,255,255,0.4), inset -4px -4px 10px rgba(0,0,0,0.1);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center;
    transition: background-color var(--ease), transform var(--ease);
  }
  .btn-scroll::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 500px;
    background: linear-gradient(132.3deg, rgba(255,255,255,0.8) 12.7%, rgba(255,255,255,0) 86.3%);
    opacity: .5;
    pointer-events: none;
  }
  .btn-scroll svg { position: relative; width: 40px; height: 40px; }
  .btn-scroll:hover { background: rgba(255,255,255,0.45); transform: translateY(2px); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1440px) {
    .mv-text { margin-left: 60px; }
    .mv-stage { margin-left: 0; transform: scale(.85); transform-origin: left center; }
  }
  @media (max-width: 1100px) {
    .header-inner { padding: 0 24px; }
    .gnb-list { display: none; }
    .gnb-cta { padding-left: 0; }
    .main-visual { height: auto; max-height: none; padding: 140px 0 160px; }
    .mv-inner { flex-direction: column; gap: 40px; }
    .mv-text { width: 100%; margin: 0; padding: 0 24px; gap: 40px; }
    .mv-copy { width: 100%; }
    .mv-stage { margin: 0; transform: scale(.6); transform-origin: top center; height: 400px; width: 764px; }
    .btn-lg { width: 100%; max-width: 303px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#" aria-label="한미그룹 홈">
      <img src="./images/logo.svg" alt="Hanmi 한미그룹">
    </a>
    <nav class="gnb" aria-label="주요 메뉴">
      <ul class="gnb-list">
        <li><a href="#job">직무소개</a></li>
        <li><a href="#qualification">지원자격 및 접수방법</a></li>
        <li><a href="#schedule">채용설명회 일정</a></li>
      </ul>
      <div class="gnb-cta">
        <a class="btn btn-sm" href="#apply">
          <span>지원하기</span>
          <svg width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </nav>
  </div>
</header>

<main>
  <section class="main-visual" id="main-visual" aria-label="메인 비주얼">
    <div class="mv-inner">
      <div class="mv-text">
        <div class="mv-copy">
          <p class="mv-sub">2026년 하반기</p>
          <h1 class="mv-title">
            <strong>한미그룹</strong>
            <span>공개채용</span>
          </h1>
          <p class="mv-period">모집기간 : 2026.9.28(월) ~ 2026.10.18(일) 23:59까지</p>
        </div>
        <div>
          <a class="btn btn-lg" href="#job">모집직무 바로가기!</a>
        </div>
      </div>

      <div class="mv-stage" aria-hidden="true">
        <div class="ring-glow"></div>
        <div class="ring-line"></div>
        <img class="mv-micro" src="./images/mv_micro.png" alt="">
        <img class="mv-char1" src="./images/mv_char1.png" alt="">
        <img class="mv-char2" src="./images/mv_char2.png" alt="">
        <img class="mv-char3" src="./images/mv_char3.png" alt="">
        <img class="mv-char4" src="./images/mv_char4.png" alt="">
        <img class="mv-star1" src="./images/mv_star1.svg" alt="">
        <img class="mv-star2" src="./images/mv_star2.svg" alt="">
        <img class="mv-star3" src="./images/mv_star3.svg" alt="">
        <img class="mv-star4" src="./images/mv_star4.svg" alt="">
        <img class="mv-star5" src="./images/mv_star3.svg" alt="">
      </div>
    </div>

    <div class="scroll-wrap">
      <button class="btn-scroll" type="button" id="scrollDown" aria-label="아래로 스크롤">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M13 17l7 7 7-7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>
</main>

<script>
  // 스크롤 버튼: 메인 비주얼 아래로 부드럽게 이동
  document.getElementById('scrollDown').addEventListener('click', function () {
    var hero = document.getElementById('main-visual');
    window.scrollTo({ top: hero.offsetHeight, behavior: 'smooth' });
  });
</script>
</body>
</html>
