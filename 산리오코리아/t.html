
<!doctype html>
<html>
  <head>
    <title>산리오 코리아 홍홍</title>
    <meta charset="UTF-8" />
  </head>

  <body>
    <main class="wrapper">

      <!-- 1. 상단영역 -->
      <header class="top-area">
        <!-- 상단영역 내용 -->
        <div class="top-inner">

          <!-- 로고이미지박스 (왼쪽 끝) -->
          <div class="logo-box">
            <img src="./images/logo_2023.png" alt="산리오코리아 로고" />
          </div>

          <!-- 메뉴리스트 (오른쪽 끝) -->
          <nav>
            <ul class="menu-list">
              <li><a href="#company">company</a></li>
              <li><a href="#character">character</a></li>
              <li><a href="#place">place</a></li>
              <li><a href="#recruit">recruit</a></li>
            </ul>
          </nav>

        </div>
      </header>

      <!-- 2. 메인영역 -->
      <section class="main-area">

        <!-- 2-1. 배너영역 -->
        <section class="banner-area">
          <!-- 배너영역 내용 -->

          <div class="center-banner">
            <!-- 메인 비주얼 이미지 -->
            <img
              src="./images/main_visual_pc_v1.png"
              alt="메인 비주얼"
              class="main-visual-img"
            />
          </div>

          <!-- SNS이동버튼박스 -->
          <div class="sns">
            <a
              href="https://www.instagram.com/sanrio_kr/"
              target="_blank"
            >
              <img
                src="./images/i_ins_pc_v3.png"
                alt="instagram"
              />
            </a>

            <a
              href="https://www.youtube.com/c/sanriokorea/featured"
              target="_blank"
            >
              <img
                src="./images/i_you_pc_v3.png"
                alt="youtube"
              />
            </a>
          </div>

          <!-- 스크롤 유도 애니박스 -->
          <div class="scroll_btn">
            <span class="mouse">
              <span></span>
            </span>
            <p>scroll down</p>
          </div>

        </section>

        <!-- 2-2. 캐릭터영역 -->
        <section class="character-area">
          <!-- 캐릭터영역 내용 -->
        </section>

        <!-- 2-3. 컴퍼니영역 -->
        <section class="company-area">
          <!-- 컴퍼니영역 내용 -->
        </section>

        <!-- 2-4. 리쿠르트영역 -->
        <section class="recruit-area">
          <!-- 리쿠르트영역 내용 -->
        </section>

        <!-- 2-5. 플레이스영역 -->
        <section class="place-area">
          <!-- 플레이스영역 내용 -->
        </section>

        <!-- 2-6. 컨텍어스영역 -->
        <section class="contactus-area">
          <!-- 컨텍어스영역 내용 -->
        </section>

      </section>

      <!-- 3. 하단영역 -->
      <footer class="bottom-area">
        <!-- 하단영역 내용 -->
      </footer>

    </main>
  </body>
</html>
