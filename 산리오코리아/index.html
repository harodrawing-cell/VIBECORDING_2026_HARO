<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산리오코리아</title>
    <style>
        /* .site-box > * > * { max-width: 1440px; margin: 0 auto; } */
        .header-area,
        .footer-area { background: #f1f1f1; padding: 20px; }
        .main-area { padding: 20px; }
        .banner-area,
        .character-area,
        .company-area,
        .recruit-area,
        .place-area,
        .contactus-area {
            margin-bottom: 24px;
            padding: 16px;
            border: 1px dashed #ccc;
        }
        .header-area .logo-box img { height: 48px; }
        .header-area > div {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-menu-nav ul {
            display: flex;
            gap: 32px;
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 18px;
        }
        .header-menu-nav a {
            text-decoration: none;
            color: inherit;
        }
        /* 배너 영역 스타일 */
        .banner-area {
            background: url('./image/main_visual_bg.jpg') repeat 0 0/50px;
            padding: 80px;

        }
        .banner-area .banner-content {
            max-width: 1440px;
            margin: 0 auto;
        }
        .banner-area .banner-img-wrapper {
            display: inline-block;
        }
        .banner-area .banner-img-wrapper img {
            /* display: block; */
            width: 984px;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <main class="site-box">
        <!-- Header -->
        <header class="header-area">
            <div>
                <figure class="logo-box" style="margin:0;">
                    <img src="./image/logo_2023.png" alt="산리오코리아 로고">
                </figure>
                <nav class="header-menu-nav">
                    <ul>
                        <li><a href="#company">company</a></li>
                        <li><a href="#character">character</a></li>
                        <li><a href="#place">place</a></li>
                        <li><a href="#recruit">recruit</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-area">
            <!-- Banner Section -->
            <style>
                .banner-content {
                    display: flex;
                    justify-content: center;
                    padding: 80px;
                }
                .sns {
                    display: flex;
                    flex-direction: column;
                    position: absolute;
                    top: 50px;
                    right: 50px;
                }
                .logo-box {
                    margin: 0;
                }
            </style>
     
            <section class="banner-area">
                <div class="banner-content" style="display: flex; justify-content: center; padding: 80px;">
                    <div class="banner-img-wrapper">
                        <img src="./image/main_visual_pc_v1.png" alt="산리오코리아 메인 비주얼">
                    </div>
 
                
                </div>
                <!--SNS 이동버튼박스 -->

                <div class="sns"style="display: flex;flex-direction: column;position: absolute;top:50px;right:50px;">
                 <a href="https://www.instagram.com/sanrio_kr/" target="_blank"><img src="./image/i_ins_pc_v3.png" alt="instargram"></a>
                 <a href="https://www.youtube.com/c/sanriokorea/featured" target="_blank"><img src="./image/i_you_pc_v3.png" alt="youtube"></a>
                </div>


            </section>
            <!-- Character Section -->
            <section class="character-area">
                <!-- 캐릭터영역 내용은 여기에 -->
            </section>

            <!-- Company Section -->
            <section class="company-area">
                <!-- 컴퍼니영역 내용은 여기에 -->
            </section>

            <!-- Recruit Section -->
            <section class="recruit-area">
                <!-- 리쿠르트영역 내용은 여기에 -->
            </section>

            <!-- Place Section -->
            <section class="place-area">
                <!-- 플레이스영역 내용은 여기에 -->
            </section>

            <!-- Contact Us Section -->
            <section class="contactus-area">
                <!-- 컨텍어스영역 내용은 여기에 -->
            </section>
        </div>

        <!-- Footer -->
        <footer class="footer-area">
            <!-- 하단영역 내용은 여기에 -->
        </footer>
    </main>
</body>
</html>
